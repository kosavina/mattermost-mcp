name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.15.2"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      # Warnings fail this step through error-on-warning in pyproject.toml.
      - run: uv run ty check
      - run: uv run pytest

  image:
    name: image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # used only by the push step, which runs on main only
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: >
          docker build --pull
          --build-arg APP_COMMIT="$GITHUB_SHA"
          --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY"
          --label org.opencontainers.image.revision="$GITHUB_SHA"
          --tag "$IMAGE:$GITHUB_SHA" .
      - name: Smoke test
        run: |
          docker run --detach --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:8000:8000 "$IMAGE:$GITHUB_SHA"
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              echo "healthy"; docker rm -f smoke; exit 0
            fi
            sleep 1
          done
          docker logs smoke; docker rm -f smoke; exit 1
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker logout ghcr.io

  deploy:
    name: deploy
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}   # this job needs no GitHub token
    environment:
      name: production
      url: https://${{ vars.MCP_PUBLIC_HOST }}/health
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # never stop a deploy halfway
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          (umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          # The server runs only mcp-deploy, whatever we send; we send the SHA.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=15 "deploy@$DEPLOY_HOST" "$GITHUB_SHA"
      - name: Check the public endpoint
        env:
          MCP_PUBLIC_HOST: ${{ vars.MCP_PUBLIC_HOST }}
        run: |
          for _ in $(seq 20); do
            if curl -fsS "https://$MCP_PUBLIC_HOST/health" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              echo "live: $GITHUB_SHA"; exit 0
            fi
            sleep 3
          done
          echo "https://$MCP_PUBLIC_HOST/health does not report $GITHUB_SHA" >&2; exit 1
