# Production stack: the app. mcp-deploy runs it with /opt/mattermost-mcp/.env and
# deployed.env (IMAGE_TAG = the commit SHA). HTTPS comes from the server's shared Caddy
# (its own compose project, outside this repo), which joins the internal network below.
name: mattermost-mcp

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

# The private network's subnet. The app trusts proxy headers from it, and only Caddy is on it.
x-internal-subnet: &internal_subnet 10.87.0.0/24

services:
  app:
    image: ghcr.io/kosavina/mattermost-mcp:${IMAGE_TAG:?IMAGE_TAG must be a commit SHA}
    restart: unless-stopped
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:?set MCP_PUBLIC_HOST in .env}
      MCP_TRUSTED_PROXIES: *internal_subnet
    # No ports: on purpose. Only Caddy, on the private network, reaches the app.
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - app_data:/data          # event subscriptions, including signing secrets: keep this volume
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  internal:
    # A fixed name, because the shared Caddy joins this network by name.
    name: mattermost-mcp_internal
    ipam:
      config:
        - subnet: *internal_subnet

volumes:
  app_data:
